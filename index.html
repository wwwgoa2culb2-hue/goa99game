<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goa 99 Club</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding-bottom: 70px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            min-height: 100vh;
            background: #181812;
            position: relative;
        }
        header {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .section-title {
            padding: 15px 15px 5px 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ff416c;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 15px;
        }
        .game-card {
            background: #222;
            border-radius: 8px;
            text-align: center;
            padding: 15px 10px;
            border: 1px solid #333;
        }
        .game-card h4 {
            font-size: 13px;
            color: #fff;
            margin-top: 5px;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 400px;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
        }
        .nav-item {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ff416c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>Goa 99 Club</header>

        <div class="section-title">Popular Games</div>
        <div class="game-grid">
            <div class="game-card">
                <h4>Aviator</h4>
            </div>
            <div class="game-card">
                <h4>Vortex</h4>
            </div>
            <div class="game-card">
                <h4>PUBG</h4>
            </div>
        </div>

        <div class="section-title">Lottery</div>
        <div class="game-grid">
            <div class="game-card">
                <h4>Win Go</h4>
            </div>
            <div class="game-card">
                <h4>K3</h4>
            </div>
            <div class="game-card">
                <h4>5D</h4>
            </div>
        </div>

        <div class="section-title">Rummy</div>
        <div class="game-grid">
            <div class="game-card">
                <h4>365 Rummy</h4>
            </div>
            <div class="game-card">
                <h4>V8 Poker</h4>
            </div>
            <div class="game-card">
                <h4>Koolbet</h4>
            </div>
        </div>

        <div class="section-title">Casino & Slots</div>
        <div class="game-grid">
            <div class="game-card">
                <h4>Crazy Time</h4>
            </div>
            <div class="game-card">
                <h4>Roulette</h4>
            </div>
            <div class="game-card">
                <h4>Jili Game</h4>
            </div>
        </div>

        <div class="section-title">Fishing</div>
        <div class="game-grid">
            <div class="game-card">
                <h4>Jackpot Fishing</h4>
            </div>
            <div class="game-card">
                <h4>Happy Fishing</h4>
            </div>
            <div class="game-card">
                <h4>Royal Fishing</h4>
            </div>
        </div>

        <div class="nav-bar">
            <a href="#" class="nav-item active">Home</a>
            <a href="#" class="nav-item">Activity</a>
            <a href="#" class="nav-item">Promotion</a>
            <a href="#" class="nav-item">Account</a>
        </div>
    </div>
</body>
</html>
